name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bangun APK
        run: |
          mkdir www
          cp -r index.html *.js style.css manifest.json icon.svg gambar www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Clo Warna" com.n0ragami44.clowarna --web-dir www
          npx cap add android
          S=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="windowNoTitle">true</item>|&\n        <item name="android:statusBarColor">#DFF1FF</item>\n        <item name="android:navigationBarColor">#DFF1FF</item>\n        <item name="android:windowLightStatusBar">true</item>\n        <item name="android:windowLightNavigationBar">true</item>|' $S
          grep -q statusBarColor $S || { echo "styles.xml tidak cocok"; cat $S; exit 1; }
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Tanda tangani
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > clo.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cd android/app/build/outputs/apk/release
          $BT/zipalign -p 4 app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks $GITHUB_WORKSPACE/clo.jks --ks-pass env:KS_PASS --ks-key-alias clo --key-pass env:KS_PASS --out $GITHUB_WORKSPACE/clo-warna.apk aligned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Clo Warna v${{ github.run_number }}
          files: clo-warna.apk
